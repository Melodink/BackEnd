services:
  postgres:
    env_file: ./.env
    image: postgres:15
    container_name: melodink-postgres
    environment:
      POSTGRES_DB: melodink
      POSTGRES_USER: ${DB_ID}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    env_file: ./.env
    container_name: melodink-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data: