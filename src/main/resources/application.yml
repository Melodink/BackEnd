spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}

    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: true

    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}

    mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        default-encoding: UTF-8
        properties:
            mail:
                transport.protocol: smtp
                debug: true
                smtp:
                    auth: true
                    starttls.enable: true
                    connection timeout: 5000
                    timeout: 5000              # 5s read timeout
                    write timeout: 5000         # 5s write timeout
                    quit wait: false            # 서버 응답 기다리지 않고 종료
                    pool: true                 # 연결 풀링
                    pool.size: 5

jwt:
    header: Authorization
    secret: ${JWT_SECRET}

app:
    front-redirect-base: ${FRONTEND_URL}
    frontend-url: ${FRONTEND_URL}
    mail:
        from: "cotw.deliver@gmail.com"

logging:
    level:
        org.hibernate.SQL: debug
        org.hibernate.orm.jdbc.bind: trace

cloud:
    aws:
        s3:
            enabled: false   # 로컬에서는 S3 Mock 사용 → AWS 자격증명 불필요
