spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}

    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}

jwt:
    header: Authorization
    secret: ${JWT_SECRET}

app:
    front-redirect-base: ${FRONTEND_URL}
    frontend-url: ${FRONTEND_URL}
